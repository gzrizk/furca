[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "furca"
version = "0.1.0"
description = "A Python toolkit for the study of planar branching structures"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name = "Gonzalo Rodriguez Rizk"}]
dependencies = [
  "networkx>=3.0",
  "pandas>=2.0",
]

[project.optional-dependencies]
extract = [
  "scikit-image>=0.20",
  "pillow>=10",
  "matplotlib>=3.7",
  "scipy>=1.10",
  "PyYAML>=6.0",
]

[tool.setuptools]
packages = ["furca"]
